[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bible-strong-tui"
dynamic = ["version"]
description = "聖經 CLI / TUI：恢復本、和合本與原文 Strong 對照"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["bible", "cli", "tui", "strong", "curses"]
classifiers = [
    "Environment :: Console :: Curses",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    'windows-curses; sys_platform == "win32"',
]

[project.urls]
Repository = "https://github.com/HaveLightII/bible-cli"
Changelog = "https://github.com/HaveLightII/bible-cli/blob/main/CHANGELOG.md"
Issues = "https://github.com/HaveLightII/bible-cli/issues"

[project.scripts]
bible = "bibletui.cli:main"

[tool.setuptools.dynamic]
version = {attr = "bibletui.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
